# ============================================================================
# AI tools declaration
# ============================================================================
ai_tools_used:
  - "Antigravity (Google DeepMind)"
  - "Claude AI (Web)"
  - "Claude Code (Anthropic)"

ai_usage_summary: |
  Antigravity (Google DeepMind's agentic coding assistant) was used for architecture
  design, code generation, debugging and iteration of the original pipeline. Claude AI
  (web) was used for architecture discussion and approach validation. Claude Code
  (Anthropic) was used in a later session to audit the pipeline and to change it:
  removing an over-broad honeypot rule, adding an availability/notice-period modifier,
  replacing the reasoning generator with a fact-grounded one, writing tests, and
  updating the documentation.
  The ranking step calls no LLM or external API and runs fully offline; an offline precompute step
  uses small local models (Qwen2.5-1.5B and 0.5B) to reword some reasoning text, and its output is cached and re-verified.
  Agentic assistants had read access to the local repository and dataset files while
  working, so sample candidate records (a synthetic, anonymised dataset) were visible
  to those tools.

# ============================================================================
# Approach summary
# ============================================================================
methodology_summary: |
  Hybrid retrieval plus a learned ranker over 100K candidates. Offline: profiles are
  parsed to parquet, MiniLM embeddings feed a FAISS index and a BM25 index, and five
  self-contained honeypot rules flag impossible profiles (skill claimed for 0 months,
  skill count vs experience, overlapping roles, date/duration mismatch, impossible
  education order). Online (CPU, offline, about 1 min 47 s, 4 GB): the union of FAISS
  top-1500 (JD "ideal candidate" paragraph) and BM25 top-1500 (JD text) gives a shortlist
  of at most 3,000; a Ridge model over 16 features (semantic similarity, JD-disqualifier
  rules, behavioural score) scores it; a post-model availability multiplier down-weights
  candidates who are long inactive, rarely reply or have long notice periods; flagged
  honeypots are removed and the top 100 are ranked. The Ridge is trained on 150
  rule-generated labels, not hand labels, so it approximates heuristics rather than
  ground truth. Reasoning starts from a deterministic generator that fills sentence frames
  only with facts from each candidate's own record; small local LLMs (Qwen2.5-1.5B/0.5B)
  reword about 40% of the rows OFFLINE, and each rewrite is cached and re-verified against the
  record at ranking time (otherwise the deterministic text is used). No LLM runs at ranking time.

